<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản Trị Trung Tâm (Admin) — Học Viện Khổng Tử Nhí</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#B91C1C">
  <link rel="icon" href="https://d21acfi38wn3iy.cloudfront.net/resource/documents/3529cd2b-7af6-4fda-887c-392a79393d6a/sofl-remake/logo.png">
  <link rel="stylesheet" href="so-lien-lac-ux.css">
  <link rel="stylesheet" href="so-lien-lac-lms.css">
  <style>
    :root { --ktn-red: #B91C1C; --ktn-bg: #F8FAFC; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; overflow-x: hidden; font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--ktn-bg); color: #0F172A; }
    .admin-header {
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 12px 24px; background: #0F172A; color: #FFFFFF;
    }
    .admin-nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .admin-nav button {
      border: 1px solid rgba(255,255,255,0.15); background: transparent; color: #CBD5E1;
      padding: 7px 14px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .admin-nav button.active { background: var(--ktn-red); border-color: var(--ktn-red); color: #FFFFFF; }
    .admin-main { max-width: 1240px; margin: 24px auto; padding: 0 16px; }
    .admin-pane { display: none; }
    .admin-pane.active { display: block; }
    .admin-card { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.03); }
    .order-row {
      display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
      padding: 14px 16px; border: 1px solid #E2E8F0; border-radius: 12px; margin-bottom: 10px; background: #F8FAFC;
    }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; display: inline-block; }
    .badge-pending { background: #FEF3C7; color: #B45309; }
    .badge-approved { background: #DCFCE7; color: #15803D; }
    .badge-blue { background: #DBEAFE; color: #1D4ED8; }
    .badge-gray { background: #F1F5F9; color: #475569; }
    .btn-approve { background: #15803D; color: #FFF; border: none; padding: 9px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .btn-red { background: var(--ktn-red); color: #FFF; border: none; padding: 9px 16px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .btn-outline { background: #FFF; color: #0F172A; border: 1px solid #CBD5E1; padding: 7px 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 12.5px; }
    .course-checkbox-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 10px;
    }
    .course-check-item {
      display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px;
      border: 1.5px solid #E2E8F0; border-radius: 10px; background: #F8FAFC; cursor: pointer; font-size: 13px;
    }
    .course-check-item:hover { border-color: #FCA5A5; background: #FFF1F2; }
    .stu-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .stu-table th, .stu-table td { padding: 12px 10px; border-bottom: 1px solid #E2E8F0; text-align: left; vertical-align: top; }
    .stu-table th { background: #F8FAFC; color: #475569; font-weight: 800; font-size: 12.5px; text-transform: uppercase; }
    .course-chip {
      display: inline-flex; align-items: center; gap: 6px; background: #FFF1F2; color: #B91C1C;
      border: 1px solid #FECACA; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 800; margin: 2px 4px 2px 0;
    }
    .course-chip button {
      border: none; background: transparent; color: #991B1B; font-weight: 900; cursor: pointer; padding: 0 2px; font-size: 13px;
    }
    @media (max-width: 640px) {
      .admin-header { padding: 10px 12px; gap: 8px; }
      .admin-nav { width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; order: 3; }
      .admin-nav button { padding: 8px 6px; font-size: 12px; text-align: center; }
      .admin-main { margin: 12px auto; padding: 0 10px; }
      .admin-card { padding: 14px; border-radius: 14px; margin-bottom: 12px; }
      .order-row { flex-direction: column; align-items: stretch; gap: 10px; }
      .order-row .btn-approve { width: 100%; text-align: center; }
      .stu-table thead { display: none; }
      .stu-table, .stu-table tbody, .stu-table tr, .stu-table td { display: block; width: 100%; box-sizing: border-box; }
      .stu-table tr { border: 1px solid #E2E8F0; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; background: #FFFFFF; }
      .stu-table td { padding: 4px 0; border-bottom: none; }
    }
  </style>
  <script src="ktn-webapp-client.js"></script>
</head>
<body>
  <header class="admin-header">
    <div style="display:flex;align-items:center;gap:8px;">
      <img src="https://d21acfi38wn3iy.cloudfront.net/resource/documents/3529cd2b-7af6-4fda-887c-392a79393d6a/sofl-remake/logo.png" alt="Logo" style="width:32px;height:32px;border-radius:50%;">
      <div>
        <strong style="font-size:14px;color:#F8FAFC;">QUẢN LÝ</strong>
        <div id="admin-welcome-label" style="font-size:11.5px;color:#94A3B8;">Đang tải...</div>
      </div>
    </div>

    <nav class="admin-nav" aria-label="Menu Quản lý">
      <button type="button" id="a-btn-orders" class="active" onclick="switchAdminTab('orders')">💳 Đơn hàng</button>
      <button type="button" id="a-btn-students" onclick="switchAdminTab('students')">🎓 Học viên &amp; Lớp</button>
      <button type="button" id="a-btn-courses" onclick="switchAdminTab('courses')">📚 Khóa học</button>
      <button type="button" id="a-btn-payment" onclick="switchAdminTab('payment')">⚙️ Thanh toán</button>
    </nav>

    <div style="display:flex;gap:6px;">
      <button type="button" onclick="enableAdminPwa()" title="Bật thông báo đơn mới" style="background:#B91C1C;color:#FFF;border:none;padding:7px 10px;border-radius:8px;font-weight:700;cursor:pointer;">🔔</button>
      <button type="button" onclick="KtnWebApp.logout()" style="background:rgba(255,255,255,0.12);color:#FFF;border:none;padding:7px 10px;border-radius:8px;font-weight:700;cursor:pointer;">Thoát</button>
    </div>
  </header>

  <main class="admin-main">
    <!-- TAB 1: ĐƠN HÀNG & DUYỆT 1 CHẠM -->
    <section id="a-pane-orders" class="admin-pane active">
      <div class="admin-card">
        <h2 style="margin:0 0 12px;font-size:16px;">➕ Tạo đơn đăng ký</h2>
        <form onsubmit="createManualOrder(event)" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;align-items:end;">
          <label style="font-size:12.5px;font-weight:700;">Họ tên:
            <input type="text" id="new-ord-name" placeholder="VD: Bé Nguyễn Hoàng Ngân" required style="width:100%;padding:8px 10px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;box-sizing:border-box;">
          </label>
          <label style="font-size:12.5px;font-weight:700;">Email:
            <input type="email" id="new-ord-email" placeholder="VD: taphong2002@gmail.com" required style="width:100%;padding:8px 10px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;box-sizing:border-box;">
          </label>
          <label style="font-size:12.5px;font-weight:700;">Điện thoại:
            <input type="text" id="new-ord-phone" placeholder="VD: 0987654321" required style="width:100%;padding:8px 10px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;box-sizing:border-box;">
          </label>
          <label style="font-size:12.5px;font-weight:700;">Khóa học:
            <select id="new-ord-course" style="width:100%;padding:8px 10px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;box-sizing:border-box;"></select>
          </label>
          <button type="submit" class="btn-red" style="height:38px;">+ Tạo &amp; Duyệt</button>
        </form>
      </div>

      <div class="admin-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h2 style="margin:0;font-size:16px;">💳 Đơn đăng ký</h2>
          <button type="button" onclick="loadAdminOrders()" class="btn-outline">🔄 Làm mới</button>
        </div>
        <div id="admin-orders-list">Đang tải...</div>
      </div>
    </section>

    <!-- TAB 2: CẤP THÊM / THU HỒI KHÓA HỌC & XẾP LỚP -->
    <section id="a-pane-students" class="admin-pane">
      <div class="admin-card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <h2 style="margin:0;font-size:16px;">🎓 Phân quyền khóa học &amp; Xếp lớp</h2>
          <div style="display:flex;gap:8px;">
            <button type="button" class="btn-outline" onclick="selectBundle6Courses()">🎁 Chọn 6 khóa</button>
            <button type="button" class="btn-outline" onclick="clearCourseCheckboxes()">Bỏ chọn</button>
          </div>
        </div>

        <form onsubmit="saveStudentCourseAssignment(event)" style="margin-top:12px;background:#F8FAFC;padding:14px;border-radius:12px;border:1px solid #E2E8F0;">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;">
            <label style="font-size:12.5px;font-weight:700;">Email học viên:
              <input type="email" id="stu-assign-email" placeholder="VD: taphong2002@gmail.com" required style="width:100%;padding:9px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;box-sizing:border-box;">
            </label>
            <label style="font-size:12.5px;font-weight:700;">Họ tên:
              <input type="text" id="stu-assign-name" placeholder="VD: Tạ Phong Võ" style="width:100%;padding:9px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;box-sizing:border-box;">
            </label>
            <label style="font-size:12.5px;font-weight:700;">Lớp học:
              <select id="stu-assign-class" style="width:100%;padding:9px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;box-sizing:border-box;">
                <option value="">-- Không xếp lớp (Chỉ Video) --</option>
                <option value="YCT2-04">Lớp YCT2-04 (Cô Lâm Mỹ Linh · T3 &amp; T6)</option>
                <option value="YCT3-02">Lớp YCT3-02 (Cô Trần Thu Hà · T4 &amp; CN)</option>
              </select>
            </label>
            <label style="font-size:12.5px;font-weight:700;">Chế độ:
              <select id="stu-assign-action" style="width:100%;padding:9px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;box-sizing:border-box;">
                <option value="grant">➕ Cộng dồn khóa</option>
                <option value="set">🔄 Đặt lại theo ô chọn</option>
              </select>
            </label>
          </div>

          <div style="margin-top:12px;font-size:12.5px;font-weight:800;color:#0F172A;">Khóa học Video:</div>
          <div id="stu-course-checkboxes" class="course-checkbox-grid"></div>

          <div style="margin-top:12px;display:flex;justify-content:flex-end;gap:10px;">
            <button type="submit" class="btn-approve">⚡ Lưu phân quyền</button>
          </div>
        </form>
      </div>

      <div class="admin-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h2 style="margin:0;font-size:16px;">📋 Danh sách học viên</h2>
          <button type="button" class="btn-outline" onclick="loadAdminStudents()">🔄 Làm mới</button>
        </div>
        <div style="overflow-x:auto;">
          <table class="stu-table">
            <thead>
              <tr>
                <th>Học viên</th>
                <th>Nhóm</th>
                <th>Lớp học</th>
                <th>Khóa học đã mở</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="admin-students-tbody">
              <tr><td colspan="5">Đang tải...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- TAB 3: KHO KHÓA HỌC & ĐỒNG BỘ IZTEACH -->
    <section id="a-pane-courses" class="admin-pane">
      <div class="admin-card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <h2 style="margin:0;font-size:16px;">📚 Danh mục khóa học</h2>
          <button type="button" class="btn-approve" onclick="syncCoursesFromIzTeach()">🔄 Đồng bộ izTeach</button>
        </div>

        <form onsubmit="addNewCourseFromIzTeach(event)" style="margin-top:12px;padding:12px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end;">
          <label style="font-size:12.5px;font-weight:700;">Course ID izTeach:
            <input type="text" id="sync-course-id" placeholder="VD: 6983672f409cc20002e530b8" required style="width:100%;padding:8px 10px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;box-sizing:border-box;">
          </label>
          <label style="font-size:12.5px;font-weight:700;">Tên khóa học:
            <input type="text" id="sync-course-title" placeholder="VD: Khóa học HSK 2" required style="width:100%;padding:8px 10px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;box-sizing:border-box;">
          </label>
          <label style="font-size:12.5px;font-weight:700;">Nhãn:
            <input type="text" id="sync-course-badge" value="KHÓA HỌC MỚI" style="width:100%;padding:8px 10px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;box-sizing:border-box;">
          </label>
          <label style="font-size:12.5px;font-weight:700;">Học phí (VNĐ):
            <input type="number" id="sync-course-price" value="890000" style="width:100%;padding:8px 10px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;box-sizing:border-box;">
          </label>
          <button type="submit" class="btn-red" style="height:38px;">+ Thêm khóa</button>
        </form>

        <div id="admin-courses-catalog-list" style="margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;">
          Đang tải...
        </div>
      </div>
    </section>

    <!-- TAB 4: CẤU HÌNH BẢNG GIÁ & VIETQR -->
    <section id="a-pane-payment" class="admin-pane">
      <div class="admin-card">
        <h2 style="margin:0 0 12px;font-size:16px;">⚙️ Cấu hình VietQR</h2>
        <form onsubmit="savePaymentConfig(event)" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:720px;">
          <label style="font-size:12.5px;font-weight:700;">Ngân hàng:
            <input type="text" id="cfg-bank-name" value="MBBank" style="width:100%;padding:9px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;">
          </label>
          <label style="font-size:12.5px;font-weight:700;">Số tài khoản:
            <input type="text" id="cfg-account-no" placeholder="Số tài khoản..." style="width:100%;padding:9px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;">
          </label>
          <label style="font-size:12.5px;font-weight:700;">Chủ tài khoản:
            <input type="text" id="cfg-account-name" value="HOC VIEN KHONG TU NHI" style="width:100%;padding:9px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;">
          </label>
          <label style="font-size:12.5px;font-weight:700;">Học phí mặc định (VNĐ):
            <input type="number" id="cfg-default-amount" value="890000" style="width:100%;padding:9px;border:1px solid #CBD5E1;border-radius:8px;margin-top:4px;">
          </label>
          <label style="grid-column:1 / -1;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:#B91C1C;padding:10px;background:#FFF1F2;border-radius:10px;">
            <input type="checkbox" id="cfg-auto-approve">
            Tự động duyệt đơn khi nhận Webhook VietQR
          </label>
          <div style="grid-column:1 / -1;">
            <button type="submit" class="btn-approve" style="background:#B91C1C;">💾 Lưu cấu hình</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    let currentAdminSession = null;
    let adminCourseCatalog = [
      { id: '6adadba969897b0002482ca5', code: 'HSK1-30', title: 'Khóa học Tiêu Chuẩn New HSK 1 (3.0)', shortTitle: 'HSK1 3.0', badge: 'TIÊU CHUẨN MỚI 3.0', lessonsCount: 15, price: 890000 },
      { id: '65e7704a9ea90c00080d5195', code: 'CFK-01', title: 'Chinese For Kids (Khóa học cho bé 5 – 6 tuổi)', shortTitle: 'Chinese For Kids', badge: 'SONG NGỮ MẦM NON', lessonsCount: 20, price: 890000 },
      { id: '6638bd09a7367400085c7ab2', code: 'KIDS-03', title: 'Tiếng Trung Trẻ Em 3 (Mini vỡ lòng 5 – 6 tuổi)', shortTitle: 'Tiếng Trung Trẻ Em 3', badge: 'CẤP ĐỘ 03', lessonsCount: 20, price: 890000 },
      { id: '678d14b960eae20002ddf8fe', code: 'KIDS-04', title: 'Tiếng Trung Trẻ Em 4 (Lộ trình 7 – 13 tuổi)', shortTitle: 'Tiếng Trung Trẻ Em 4', badge: 'CẤP ĐỘ 04', lessonsCount: 18, price: 890000 },
      { id: '67a7290a5fdc26000238b4e9', code: 'KIDS-05', title: 'Tiếng Trung Trẻ Em 5 (Lộ trình 8 – 14 tuổi)', shortTitle: 'Tiếng Trung Trẻ Em 5', badge: 'CẤP ĐỘ 05', lessonsCount: 20, price: 890000 },
      { id: '67a869302ecb9c000257d966', code: 'KIDS-06', title: 'Tiếng Trung Trẻ Em 6 (Lộ trình 9 – 15 tuổi)', shortTitle: 'Tiếng Trung Trẻ Em 6', badge: 'CẤP ĐỘ 06', lessonsCount: 20, price: 890000 },
      { id: '6983672f409cc20002e530b8', code: 'YCT-04', title: 'Khóa học Tiếng Trung Trẻ Em YCT 4', shortTitle: 'Tiếng Trung YCT 4', badge: 'CHỨNG CHỈ YCT 4', lessonsCount: 20, price: 1290000 },
      { id: '65e76a533f5e7c00086715d7', code: 'PRON-01', title: 'Khóa học Phát Âm & Giao Tiếp Phản Xạ Cơ Bản', shortTitle: 'Phát Âm & Phản Xạ', badge: 'GIAO TIẾP PHẢN XẠ', lessonsCount: 19, price: 690000 },
      { id: '67bebce067dba000027d8119', code: 'HANZI-01', title: 'Khóa học Hán Tự Tư Duy & Luyện Viết Chữ Hán', shortTitle: 'Hán Tự Tư Duy', badge: 'HÁN TỰ TƯ DUY', lessonsCount: 20, price: 690000 },
      { id: 'BUNDLE_YCT_ALL', code: 'COMBO-6', title: 'Trọn Bộ 6 Khóa Học Trực Tuyến (Lộ trình 5 – 15 tuổi)', shortTitle: 'Trọn Bộ 6 Khóa', badge: 'COMBO ƯU ĐÃI 50%', lessonsCount: 113, price: 2990000, isBundle: true }
    ];

    function switchAdminTab(tab) {
      ['orders', 'students', 'courses', 'payment'].forEach(t => {
        document.getElementById('a-btn-' + t).classList.toggle('active', t === tab);
        document.getElementById('a-pane-' + t).classList.toggle('active', t === tab);
      });
      if (tab === 'orders') loadAdminOrders();
      if (tab === 'students') loadAdminStudents();
      if (tab === 'courses') loadAdminCoursesCatalog();
      if (tab === 'payment') loadPaymentConfig();
    }

    function esc(val) {
      return window.KtnWebApp?.escapeHtml ? window.KtnWebApp.escapeHtml(val) : String(val ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function renderCourseSelectors() {
      const ordSelect = document.getElementById('new-ord-course');
      if (ordSelect) {
        ordSelect.innerHTML = adminCourseCatalog.map(c =>
          `<option value="${esc(c.id)}" data-title="${esc(c.title)}" data-price="${esc(c.price || 890000)}">${esc(c.shortTitle || c.title)} (${Number(c.price || 890000).toLocaleString('vi-VN')}đ)</option>`
        ).join('');
      }
      const checkGrid = document.getElementById('stu-course-checkboxes');
      if (checkGrid) {
        const singleCourses = adminCourseCatalog.filter(c => !c.isBundle && c.id !== 'BUNDLE_YCT_ALL');
        checkGrid.innerHTML = singleCourses.map(c => `
          <label class="course-check-item">
            <input type="checkbox" name="stu-course-chk" value="${esc(c.id)}" style="margin-top:3px;">
            <div>
              <div style="font-weight:800;color:#0F172A;">${esc(c.shortTitle || c.title)}</div>
              <div style="font-size:11.5px;color:#64748B;">Mã: ${esc(c.code || String(c.id || '').slice(-6))} · ${esc(c.lessonsCount || 20)} bài học</div>
            </div>
          </label>
        `).join('');
      }
    }

    function selectBundle6Courses() {
      const bundleIds = new Set([
        '6adadba969897b0002482ca5',
        '65e7704a9ea90c00080d5195',
        '6638bd09a7367400085c7ab2',
        '678d14b960eae20002ddf8fe',
        '67a7290a5fdc26000238b4e9',
        '67a869302ecb9c000257d966'
      ]);
      document.querySelectorAll('input[name="stu-course-chk"]').forEach(chk => {
        if (bundleIds.has(chk.value)) chk.checked = true;
      });
    }

    function clearCourseCheckboxes() {
      document.querySelectorAll('input[name="stu-course-chk"]').forEach(chk => {
        chk.checked = false;
      });
    }

    async function loadAdminCoursesCatalog() {
      const res = await KtnWebApp.apiRequest('/api/ktn/courses');
      if (res.ok && Array.isArray(res.data?.courses) && res.data.courses.length > 0) {
        adminCourseCatalog = res.data.courses;
      }
      renderCourseSelectors();
      const box = document.getElementById('admin-courses-catalog-list');
      if (!box) return;
      box.innerHTML = adminCourseCatalog.map(c => `
        <div style="padding:14px;border:1px solid #E2E8F0;border-radius:12px;background:#F8FAFC;display:flex;flex-direction:column;justify-content:space-between;gap:8px;">
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <span class="badge ${c.isBundle ? 'badge-approved' : 'badge-blue'}">${esc(c.badge || 'KHÓA HỌC')}</span>
              <code style="font-size:11px;color:#64748B;">ID: ${esc(c.id)}</code>
            </div>
            <div style="font-weight:800;font-size:14.5px;margin-top:6px;color:#0F172A;">${esc(c.title)}</div>
            <div style="font-size:12.5px;color:#475569;margin-top:4px;">
              🎬 <strong>${esc(c.lessonsCount || 20)} bài</strong> · <strong>${Number(c.price || 890000).toLocaleString('vi-VN')}đ</strong>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function syncCoursesFromIzTeach() {
      const res = await KtnWebApp.apiRequest('/api/ktn/courses/sync-izteach', {
        method: 'POST',
        body: {}
      });
      if (!res.ok) {
        alert(res.data?.message || 'Chưa đồng bộ được danh sách khóa học.');
        return;
      }
      alert(res.data?.message || '✅ Đã đồng bộ danh mục khóa học từ izTeach!');
      await loadAdminCoursesCatalog();
    }

    async function addNewCourseFromIzTeach(e) {
      e.preventDefault();
      const courseId = document.getElementById('sync-course-id').value.trim();
      const title = document.getElementById('sync-course-title').value.trim();
      const badge = document.getElementById('sync-course-badge').value.trim();
      const price = Number(document.getElementById('sync-course-price').value) || 890000;
      if (!courseId || !title) return;

      const res = await KtnWebApp.apiRequest('/api/ktn/courses/sync-izteach', {
        method: 'POST',
        body: { courseId, title, shortTitle: title, badge, price }
      });
      if (!res.ok) {
        alert(res.data?.message || 'Không thêm được khóa học mới.');
        return;
      }
      document.getElementById('sync-course-id').value = '';
      document.getElementById('sync-course-title').value = '';
      alert(`✅ Đã đồng bộ khóa học "${title}" (${courseId}) và tải danh sách bài giảng từ izTeach!`);
      await loadAdminCoursesCatalog();
    }

    async function createManualOrder(e) {
      e.preventDefault();
      const studentName = document.getElementById('new-ord-name').value.trim();
      const studentEmail = document.getElementById('new-ord-email').value.trim();
      const phone = document.getElementById('new-ord-phone').value.trim();
      const sel = document.getElementById('new-ord-course');
      const opt = sel.options[sel.selectedIndex];
      const courseId = sel.value;
      const courseName = opt?.getAttribute('data-title') || sel.value;
      const amount = Number(opt?.getAttribute('data-price')) || 890000;

      const createRes = await KtnWebApp.apiRequest('/api/ktn/orders', {
        method: 'POST',
        body: { studentName, studentEmail, phone, courseId, courseName, amount }
      });
      if (!createRes.ok || !createRes.data?.order) {
        alert(createRes.data?.message || 'Lỗi tạo đơn hàng.');
        return;
      }
      const orderId = createRes.data.order.order_id;
      await approveOrderNow(orderId, createRes.data.order);
    }

    async function loadAdminOrders() {
      const box = document.getElementById('admin-orders-list');
      const res = await KtnWebApp.apiRequest('/api/ktn/orders');
      const orders = (res.ok && Array.isArray(res.data?.orders)) ? res.data.orders : [];
      if (!orders.length) {
        box.innerHTML = '<div style="padding:16px;color:#64748B;">Chưa có đơn hàng mới.</div>';
        return;
      }
      box.innerHTML = orders.map(ord => {
        const isApproved = ord.approval_status === 'approved';
        const payLabel = ord.payment_status === 'paid'
          ? '💰 Đã CK'
          : '⏳ Chờ CK';
        const jsEmail = esc(String(ord.student_email || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
        const jsOrderId = esc(String(ord.order_id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
        return `<div class="order-row">
          <div>
            <div style="font-weight:800;font-size:14.5px;">${esc(ord.order_id)} · ${esc(ord.student_name)} (${esc(ord.phone)})</div>
            <div style="font-size:12.5px;color:#475569;margin-top:3px;">
              <strong>${esc(ord.student_email)}</strong> · <strong>${esc(ord.course_name)}</strong> · ${Number(ord.amount || 890000).toLocaleString('vi-VN')}đ
            </div>
            <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
              <span class="badge ${isApproved ? 'badge-approved' : 'badge-pending'}">${payLabel}</span>
              <span class="badge ${isApproved ? 'badge-approved' : 'badge-pending'}">${isApproved ? '✓ Đã duyệt' : '⏳ Chờ duyệt'}</span>
            </div>
          </div>
          <div>
            ${isApproved
              ? `<button type="button" class="btn-approve" style="background:#334155;" onclick="copyApprovedAccount('${jsEmail}')">📋 Copy TK</button>`
              : `<button type="button" class="btn-approve" onclick="approveOrderNow('${jsOrderId}')">⚡ Duyệt đơn</button>`
            }
          </div>
        </div>`;
      }).join('');
    }

    async function approveOrderNow(orderId, orderPayload) {
      const res = await KtnWebApp.apiRequest('/api/ktn/orders/approve', {
        method: 'POST',
        body: { orderId, order: orderPayload }
      });
      if (!res.ok) {
        alert(res.data?.message || 'Chưa duyệt được đơn hàng.');
        return;
      }
      copyApprovedAccount(res.data.studentEmail);
      loadAdminOrders();
    }

    function copyApprovedAccount(email) {
      const text = `Học Viện Khổng Tử Nhí gửi thông tin tài khoản học tập:\n- Trang đăng nhập: https://khongtunhi.com/?login=1\n- Tài khoản: ${email}\n- Mật khẩu mặc định: 123456`;
      navigator.clipboard?.writeText(text);
      alert('📋 Đã kích hoạt trên izTeach & sao chép thông tin tài khoản để gửi Zalo cho phụ huynh:\n\n' + text);
    }

    async function loadAdminStudents() {
      const tbody = document.getElementById('admin-students-tbody');
      const res = await KtnWebApp.apiRequest('/api/ktn/students');
      const list = (res.ok && Array.isArray(res.data?.students)) ? res.data.students : [];
      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#64748B;">Chưa có học viên.</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(stu => {
        const courses = Array.isArray(stu.online_courses) ? stu.online_courses : [];
        const sCase = stu.studentCase || 'unassigned';
        let caseBadge = '<span class="badge badge-gray">⏳ Chưa kích hoạt</span>';
        if (sCase === 'both') caseBadge = '<span class="badge badge-approved">✓ Video + Lớp</span>';
        else if (sCase === 'online_only') caseBadge = '<span class="badge badge-blue">🎬 Khóa Video</span>';
        else if (sCase === 'sll_only') caseBadge = '<span class="badge badge-pending">🏫 Lớp Cô</span>';

        const jsStuEmail = esc(String(stu.email || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
        const jsStuName = esc(String(stu.name || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
        const jsStuClass = esc(String(stu.class_code || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
        const jsCourseCsv = esc(courses.map(c => c.id).join(','));

        const courseChips = courses.length > 0
          ? courses.map(c => {
              const jsCid = esc(String(c.id || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
              return `
                <span class="course-chip">
                  🎬 ${esc(c.title || c.id)}
                  <button type="button" title="Thu hồi khóa học này" onclick="revokeSingleCourse('${jsStuEmail}', '${jsCid}')">×</button>
                </span>
              `;
            }).join('')
          : '<span style="color:#94A3B8;font-size:12.5px;">Chưa có khóa</span>';

        return `<tr>
          <td>
            <div style="font-weight:800;color:#0F172A;">${esc(stu.name || stu.email)}</div>
            <div style="font-size:12px;color:#64748B;">${esc(stu.email)} · ${esc(stu.code || '--')}</div>
          </td>
          <td>${caseBadge}</td>
          <td>
            ${stu.class_code
              ? `<strong style="color:#B91C1C;">🏫 ${esc(stu.class_code)}</strong>`
              : '<span style="color:#94A3B8;font-size:12.5px;">Chưa xếp lớp</span>'}
          </td>
          <td>${courseChips}</td>
          <td>
            <button type="button" class="btn-outline" onclick="prefillStudentEditor('${jsStuEmail}', '${jsStuName}', '${jsStuClass}', '${jsCourseCsv}')">
              ✏️ Sửa / Cấp khóa
            </button>
          </td>
        </tr>`;
      }).join('');
    }

    function prefillStudentEditor(email, name, classCode, courseIdsCsv) {
      document.getElementById('stu-assign-email').value = email;
      document.getElementById('stu-assign-name').value = name;
      document.getElementById('stu-assign-class').value = classCode || '';
      const activeSet = new Set((courseIdsCsv || '').split(',').filter(Boolean));
      document.querySelectorAll('input[name="stu-course-chk"]').forEach(chk => {
        chk.checked = activeSet.has(chk.value);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function saveStudentCourseAssignment(e) {
      e.preventDefault();
      const email = document.getElementById('stu-assign-email').value.trim();
      const name = document.getElementById('stu-assign-name').value.trim();
      const classCode = document.getElementById('stu-assign-class').value;
      const action = document.getElementById('stu-assign-action').value;
      const checkedIds = Array.from(document.querySelectorAll('input[name="stu-course-chk"]:checked')).map(el => el.value);

      const res = await KtnWebApp.apiRequest('/api/ktn/students/courses', {
        method: 'POST',
        body: {
          email,
          name,
          classCode: classCode || null,
          action,
          courseIds: checkedIds
        }
      });
      if (!res.ok) {
        alert(res.data?.message || 'Lỗi cập nhật khóa học cho học viên.');
        return;
      }
      alert(res.data?.message || '✅ Đã cập nhật khóa học & xếp lớp thành công!');
      await loadAdminStudents();
    }

    async function revokeSingleCourse(email, courseId) {
      if (!confirm(`Bạn muốn thu hồi khóa học (${courseId}) khỏi tài khoản ${email}?`)) return;
      const res = await KtnWebApp.apiRequest('/api/ktn/students/courses', {
        method: 'POST',
        body: { email, action: 'revoke', courseIds: [courseId] }
      });
      if (!res.ok) {
        alert(res.data?.message || 'Không thu hồi được khóa học.');
        return;
      }
      await loadAdminStudents();
    }

    async function loadPaymentConfig() {
      const res = await KtnWebApp.apiRequest('/api/ktn/payment-config');
      const cfg = res.data?.config;
      if (!cfg) return;
      document.getElementById('cfg-bank-name').value = cfg.bank_name || 'MBBank';
      document.getElementById('cfg-account-no').value = cfg.account_no || '';
      document.getElementById('cfg-account-name').value = cfg.account_name || 'HOC VIEN KHONG TU NHI';
      document.getElementById('cfg-default-amount').value = cfg.default_amount || 890000;
      document.getElementById('cfg-auto-approve').checked = Boolean(cfg.auto_approve_webhook);
    }

    async function savePaymentConfig(e) {
      e.preventDefault();
      const res = await KtnWebApp.apiRequest('/api/ktn/payment-config', {
        method: 'PUT',
        body: {
          bankName: document.getElementById('cfg-bank-name').value.trim(),
          accountNo: document.getElementById('cfg-account-no').value.trim(),
          accountName: document.getElementById('cfg-account-name').value.trim(),
          defaultAmount: Number(document.getElementById('cfg-default-amount').value) || 890000,
          autoApproveWebhook: document.getElementById('cfg-auto-approve').checked
        }
      });
      alert(res.ok ? '✅ Đã lưu cấu hình Bảng giá & VietQR lên Supabase!' : 'Lỗi lưu cấu hình.');
    }

    async function enableAdminPwa() {
      const res = await KtnWebApp.registerPwaNotifications({ onSubmitted: true, onAssignedOrChat: true });
      alert(res.ok ? '🔔 Đã bật chuông thông báo Đơn hàng mới & Cảnh báo DLP cho Quản lý!' : (res.reason || 'Chưa bật được thông báo.'));
    }

    document.addEventListener('DOMContentLoaded', async () => {
      renderCourseSelectors();
      currentAdminSession = await KtnWebApp.enforceRolePage('admin');
      if (!currentAdminSession) return;
      document.getElementById('admin-welcome-label').textContent =
        `Quản lý: ${currentAdminSession.name || currentAdminSession.email} (${currentAdminSession.email})`;
      loadAdminCoursesCatalog();
      loadAdminOrders();
    });
  </script>
</body>
</html>
