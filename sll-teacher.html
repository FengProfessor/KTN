<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Không Gian Giáo Viên — Học Viện Khổng Tử Nhí</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#B91C1C">
  <link rel="icon" href="https://d21acfi38wn3iy.cloudfront.net/resource/documents/3529cd2b-7af6-4fda-887c-392a79393d6a/sofl-remake/logo.png">
  <link rel="stylesheet" href="so-lien-lac-ux.css">
  <link rel="stylesheet" href="so-lien-lac-lms.css">
  <style>
    :root { --ktn-red: #B91C1C; --ktn-bg: #F8FAFC; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; overflow-x: hidden; font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--ktn-bg); color: #0F172A; }
    .teacher-header {
      position: sticky; top: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 12px 16px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0;
    }
    .teacher-nav { display: flex; gap: 6px; flex-wrap: wrap; max-width: 100%; background: #F1F5F9; padding: 4px; border-radius: 16px; }
    .teacher-nav button {
      border: none; background: transparent; padding: 8px 14px; border-radius: 999px;
      font-weight: 700; font-size: 13px; color: #475569; cursor: pointer; font-family: inherit;
    }
    .teacher-nav button.active { background: var(--ktn-red); color: #FFFFFF; }
    .teacher-container { max-width: 1120px; margin: 24px auto; padding: 0 16px; }
    .teacher-pane { display: none; }
    .teacher-pane.active { display: block; }
    .card { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; padding: 20px; margin-bottom: 18px; }
    .hw-item {
      display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px;
      padding: 16px; border: 1px solid #E2E8F0; border-radius: 12px; margin-bottom: 12px; background: #FFFFFF;
    }
    @media (max-width: 768px) { .hw-item { grid-template-columns: 1fr; } }
    .btn-red { background: var(--ktn-red); color: #FFF; border: none; padding: 9px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn-amber { background: #FFFBEB; color: #B45309; border: 1.5px solid #FCD34D; padding: 9px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .btn-outline { background: #FFF; color: #0F172A; border: 1px solid #CBD5E1; padding: 7px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .quick-rubric-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
    .quick-rubric-chip {
      background: #F8FAFC; border: 1px solid #CBD5E1; color: #334155;
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .quick-rubric-chip:hover { border-color: var(--ktn-red); color: var(--ktn-red); }
    .exercise-edit-row {
      display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
    }
    .exercise-edit-row input {
      flex: 1; padding: 9px 12px; border: 1px solid #CBD5E1; border-radius: 8px; font-size: 13.5px;
    }
    .teacher-mode-segmented {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #F1F5F9;
      padding: 4px; border-radius: 10px; margin-bottom: 10px;
    }
    .teacher-mode-btn {
      border: none; background: transparent; color: #475569; padding: 8px 10px;
      border-radius: 8px; font-size: 12.5px; font-weight: 800; cursor: pointer; font-family: inherit;
      white-space: nowrap;
    }
    .teacher-mode-btn.active {
      background: #FFFFFF; color: var(--ktn-red); box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
    }
    .teacher-room-strip {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px;
      scrollbar-width: none;
    }
    .teacher-room-strip::-webkit-scrollbar { display: none; }
    .teacher-room-pill {
      border: 1px solid #CBD5E1; background: #F8FAFC; color: #334155;
      padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 800;
      cursor: pointer; white-space: nowrap; font-family: inherit;
    }
    .teacher-room-pill.active {
      background: #FFF1F2; color: var(--ktn-red); border-color: #FDA4AF;
    }
    .teacher-pin-banner {
      background: #FFFBEB; border: 1px solid #FDE68A; border-left: 3px solid #D97706;
      border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; font-size: 12.5px; color: #92400E;
    }
    @media (max-width: 640px) {
      .teacher-header { padding: 8px 10px; gap: 6px; }
      .teacher-nav { order: 3; width: 100%; justify-content: space-between; padding: 3px; border-radius: 12px; }
      .teacher-nav button { flex: 1; text-align: center; padding: 7px 6px; font-size: 12px; white-space: nowrap; }
      .teacher-container { margin: 10px auto; padding: 0 10px; }
      .card { padding: 12px; border-radius: 12px; margin-bottom: 12px; }
      .hw-item { padding: 12px; gap: 10px; }
      #teacher-welcome-label { display: none; }
      .teacher-mode-btn { font-size: 11.5px; padding: 8px 6px; }
      #teacher-room-select { display: none; }
      #teacher-chat-box { height: 420px !important; }
    }
  </style>
  <script src="ktn-webapp-client.js"></script>
</head>
<body>
  <header class="teacher-header">
    <div style="display:flex;align-items:center;gap:8px;">
      <img src="https://d21acfi38wn3iy.cloudfront.net/resource/documents/3529cd2b-7af6-4fda-887c-392a79393d6a/sofl-remake/logo.png" alt="Logo" style="width:32px;height:32px;border-radius:50%;">
      <div>
        <strong style="color:#B91C1C;font-size:14px;">GIÁO VIÊN</strong>
        <div id="teacher-welcome-label" style="font-size:11.5px;color:#64748B;">Đang tải...</div>
      </div>
    </div>

    <nav class="teacher-nav" aria-label="Menu Giáo viên">
      <button type="button" id="t-btn-grade" class="active" onclick="switchTeacherTab('grade')">📝 Chấm bài</button>
      <button type="button" id="t-btn-assign" onclick="switchTeacherTab('assign')">📅 Giao bài</button>
      <button type="button" id="t-btn-groups" onclick="switchTeacherTab('groups')">💬 Nhóm lớp</button>
    </nav>

    <div style="display:flex;gap:6px;margin-left:auto;">
      <button type="button" class="btn-outline" style="border-color:#FECACA;color:#B91C1C;background:#FFF1F2;padding:6px 10px;font-size:12px;" onclick="enableTeacherPwa()" title="Bật thông báo">🔔</button>
      <button type="button" class="btn-outline" style="padding:6px 10px;font-size:12px;" onclick="KtnWebApp.logout()">Thoát</button>
    </div>
  </header>

  <main class="teacher-container">
    <!-- TAB 1: CHẤM BÀI -->
    <section id="t-pane-grade" class="teacher-pane active">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          <h2 style="margin:0;font-size:16px;">📝 Bài nộp học sinh</h2>
          <button type="button" class="btn-outline" style="font-size:12px;padding:6px 10px;" onclick="loadTeacherHomeworks()">🔄 Làm mới</button>
        </div>
        <div id="teacher-grade-list">Đang tải...</div>
      </div>
    </section>

    <!-- TAB 2: QUẢN LÝ BUỔI HỌC & GIAO BÀI -->
    <section id="t-pane-assign" class="teacher-pane">
      <div class="card">
        <h2 style="margin:0 0 12px;font-size:16px;">📅 Giao bài theo buổi</h2>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:640px;margin-bottom:12px;">
          <label style="font-size:12.5px;font-weight:700;">Lớp:
            <select id="assign-class-code" onchange="loadTeacherClassSessionEditor()" style="width:100%;padding:8px;border-radius:8px;border:1px solid #CBD5E1;margin-top:4px;">
              <option value="YCT2-04">YCT2-04 (T3 &amp; T6)</option>
              <option value="YCT1-01">YCT1-01 (T2 &amp; T5)</option>
              <option value="YCT3-02">YCT3-02 (T4 &amp; CN)</option>
            </select>
          </label>
          <label style="font-size:12.5px;font-weight:700;">Buổi:
            <select id="assign-lesson-num" onchange="loadTeacherClassSessionEditor()" style="width:100%;padding:8px;border-radius:8px;border:1px solid #CBD5E1;margin-top:4px;">
              <option value="1">Buổi 1</option>
              <option value="2">Buổi 2</option>
              <option value="3">Buổi 3</option>
              <option value="4">Buổi 4</option>
              <option value="5">Buổi 5</option>
            </select>
          </label>
        </div>

        <form onsubmit="saveTeacherClassSession(event)" style="max-width:740px;">
          <div style="margin-bottom:10px;">
            <label style="display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;">Tên buổi học:</label>
            <input type="text" id="assign-session-title" required placeholder="VD: Buổi 1: Chào hỏi & Tự giới thiệu" style="width:100%;padding:9px 10px;border:1px solid #CBD5E1;border-radius:8px;font-size:13.5px;box-sizing:border-box;">
          </div>

          <div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <label style="font-size:12.5px;font-weight:700;">Bài tập:</label>
              <button type="button" class="btn-outline" onclick="addExerciseRowToSessionEditor()" style="font-size:12px;padding:4px 10px;">+ Bài tập</button>
            </div>
            <div id="assign-exercises-container"></div>
          </div>

          <div style="display:flex;align-items:center;gap:10px;">
            <button type="submit" class="btn-red">✓ Giao bài</button>
            <span id="assign-save-status" style="font-size:12.5px;color:#15803D;font-weight:600;"></span>
          </div>
        </form>
      </div>
    </section>

    <!-- TAB 3: NHÓM LỚP & HỘP THƯ 1-1 -->
    <section id="t-pane-groups" class="teacher-pane">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          <h2 id="teacher-chat-title" style="margin:0;font-size:16px;">💬 Nhóm lớp trao đổi</h2>
          <select id="teacher-room-select" onchange="onTeacherRoomSelectChange(this.value)" style="padding:6px 10px;border-radius:8px;border:1px solid #CBD5E1;font-weight:700;font-size:12.5px;">
            <option value="class:YCT2-04">🏫 Lớp YCT2-04</option>
            <option value="class:YCT1-01">🏫 Lớp YCT1-01</option>
            <option value="class:YCT3-02">🏫 Lớp YCT3-02</option>
            <option value="course:6adadba969897b0002482ca5">🎬 Khóa HSK1 3.0</option>
            <option value="course:65e7704a9ea90c00080d5195">🎬 Khóa Chinese For Kids</option>
            <option value="course:65e769bd637339000870618f">🎬 Khóa Tiếng Trung Trẻ Em 1</option>
            <option value="student:taphong2002@gmail.com">👩‍🏫 HS: Tạ Phong Võ (1-1)</option>
            <option value="student:hoangngan@khongtunhi.com">👩‍🏫 HS: Nguyễn Hoàng Ngân (1-1)</option>
          </select>
        </div>

        <!-- BỘ LỌC NHANH: NHÓM LỚP & KHÓA vs NHẮN RIÊNG HS (1-1) -->
        <div class="teacher-mode-segmented" role="tablist">
          <button type="button" id="btn-teacher-mode-group" class="teacher-mode-btn active" onclick="switchTeacherChatFilter('group')">
            👥 Nhóm Lớp &amp; Khóa
          </button>
          <button type="button" id="btn-teacher-mode-private" class="teacher-mode-btn" onclick="switchTeacherChatFilter('private')">
            👩‍🏫 Nhắn riêng HS (1-1)
          </button>
        </div>

        <!-- DẢI PILL CHỌN PHÒNG NHANH -->
        <div id="teacher-room-strip" class="teacher-room-strip"></div>

        <!-- THÔNG BÁO GHIM CỦA PHÒNG & Ô GHIM NHANH -->
        <div id="teacher-pinned-banner" class="teacher-pin-banner">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div style="flex:1;min-width:0;">
              <strong>📌 Thông báo lớp:</strong>
              <span id="teacher-pinned-text">Chào các con! Các con trao đổi bài học và hỏi bài cùng Cô Lâm Mỹ Linh tại nhóm lớp nhé.</span>
            </div>
          </div>
          <div id="teacher-pin-editor-row" style="display:flex;gap:6px;margin-top:6px;">
            <input type="text" id="teacher-pin-input" placeholder="Nhập nội dung thông báo ghim đầu nhóm..." style="flex:1;padding:6px 10px;border:1px solid #FCD34D;border-radius:8px;font-size:12px;background:#FFFFFF;">
            <button type="button" id="btn-teacher-pin-save" onclick="pinTeacherAnnouncement()" style="background:#D97706;color:#FFFFFF;border:none;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;">📌 Ghim</button>
          </div>
        </div>

        <div id="teacher-chat-box" style="height:310px;overflow-y:auto;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;padding:12px;margin-bottom:8px;"></div>
        <form onsubmit="sendTeacherChat(event)" style="display:flex;gap:6px;">
          <input type="text" id="teacher-chat-input" placeholder="Nhập tin nhắn trao đổi..." style="flex:1;padding:9px 10px;border:1px solid #CBD5E1;border-radius:8px;" required>
          <button type="submit" class="btn-red">Gửi</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    let currentTeacherSession = null;
    let teacherSessionsMap = {};

    const DEFAULT_CLASS_SESSIONS = {
      'YCT2-04': [
        {
          classCode: 'YCT2-04',
          sessionNum: 1,
          title: 'Buổi 1: Chào hỏi & Tự giới thiệu bản thân (你好，我叫…)',
          exercises: [
            { id: 'YCT2-04-B1-E1', num: 1, title: 'Bài 1: Thu âm đọc to 5 mẫu câu tự giới thiệu tên và tuổi', type: 'audio' },
            { id: 'YCT2-04-B1-E2', num: 2, title: 'Bài 2: Chụp ảnh vở viết chữ Hán bài 1 (你, 好, 我, 叫)', type: 'photo' }
          ]
        },
        {
          classCode: 'YCT2-04',
          sessionNum: 2,
          title: 'Buổi 2: Gia đình của em & Các thành viên (我的家人)',
          exercises: [
            { id: 'YCT2-04-B2-E1', num: 1, title: 'Bài 1: Thu âm giới thiệu các thành viên trong gia đình bằng tiếng Trung', type: 'audio' },
            { id: 'YCT2-04-B2-E2', num: 2, title: 'Bài 2: Chụp ảnh bài tập nối từ và viết chữ Hán trang 15', type: 'photo' }
          ]
        },
        {
          classCode: 'YCT2-04',
          sessionNum: 3,
          title: 'Buổi 3: Thời gian & Lịch sinh hoạt hàng ngày (现在几点？)',
          exercises: [
            { id: 'YCT2-04-B3-E1', num: 1, title: 'Bài 1: Thu âm hỏi đáp giờ giấc và lịch đi học của em', type: 'audio' }
          ]
        }
      ],
      'YCT1-01': [
        {
          classCode: 'YCT1-01',
          sessionNum: 1,
          title: 'Buổi 1: Làm quen thanh điệu Pinyin & Lời chào đầu tiên',
          exercises: [
            { id: 'YCT1-01-B1-E1', num: 1, title: 'Bài 1: Thu âm đọc 4 thanh điệu và lời chào Nǐ hǎo, Lǎoshī hǎo', type: 'audio' },
            { id: 'YCT1-01-B1-E2', num: 2, title: 'Bài 2: Chụp ảnh vở tô nét cơ bản chữ Nhất (一), Nhị (二), Tam (三)', type: 'photo' }
          ]
        }
      ]
    };

    function switchTeacherTab(tab) {
      const normTab = tab === 'chat' ? 'groups' : tab;
      ['grade', 'assign', 'groups'].forEach(t => {
        document.getElementById('t-btn-' + t).classList.toggle('active', t === normTab);
        document.getElementById('t-pane-' + t).classList.toggle('active', t === normTab);
      });
      if (normTab === 'grade') loadTeacherHomeworks();
      if (normTab === 'assign') loadTeacherClassSessionEditor();
      if (normTab === 'groups') loadTeacherChat();
    }

    function appendQuickRubric(hwId, text) {
      const fbEl = document.getElementById('fb-' + hwId);
      if (!fbEl) return;
      const cur = fbEl.value.trim();
      fbEl.value = cur ? (cur + ' ' + text) : text;
      fbEl.focus();
    }

    function esc(val) {
      return window.KtnWebApp?.escapeHtml ? window.KtnWebApp.escapeHtml(val) : String(val ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function safeUrl(url) {
      if (window.KtnWebApp?.safeUrl) return window.KtnWebApp.safeUrl(url);
      if (!url) return '';
      const s = String(url).trim();
      return /^(https?:\/\/|\/|blob:|data:audio\/|data:image\/)/i.test(s) ? esc(s) : '';
    }

    function renderHomeworkStatusBadge(status, score) {
      if (status === 'revision_requested' || status === 'needs_revision') {
        return '<span style="background:#FEF3C7;color:#B45309;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px;">Cần sửa lại bài</span>';
      }
      if (status === 'graded') {
        return `<span style="background:#DCFCE7;color:#15803D;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px;">Đã hoàn thành${score != null ? ' · ' + esc(score) + '/10' : ''}</span>`;
      }
      return '<span style="background:#F1F5F9;color:#475569;padding:3px 10px;border-radius:999px;font-weight:700;font-size:12px;">Chờ cô chấm</span>';
    }

    function renderHomeworkMediaPreview(hw) {
      const items = [];
      if (Array.isArray(hw.attachments) && hw.attachments.length) {
        hw.attachments.forEach(att => {
          const url = att && (att.fileUrl || att.cdnUrl || att.url || (typeof att.link === 'string' && att.link.startsWith('http') ? att.link : ''));
          if (url) {
            items.push({
              url,
              title: att.title || 'Tệp bài làm',
              mediaType: att.mediaType || att.mimeType || ''
            });
          }
        });
      }
      if (!items.length && hw.file_url) {
        items.push({
          url: hw.file_url,
          title: 'Tệp bài làm của học sinh',
          mediaType: hw.file_type || ''
        });
      }
      if (!items.length) {
        return '<div style="font-size:12.5px;color:#94A3B8;margin-top:4px;">Chưa có tệp đính kèm hợp lệ.</div>';
      }
      return items.map(item => {
        const lowerUrl = String(item.url).toLowerCase();
        const sUrl = safeUrl(item.url);
        const sTitle = esc(item.title);
        if (!sUrl) return '';
        const isAudio = String(item.mediaType).startsWith('audio') || /\.(webm|mp3|wav|m4a|ogg|aac)(\?|$)/.test(lowerUrl);
        const isImage = String(item.mediaType).startsWith('image') || /\.(jpg|jpeg|png|webp|gif)(\?|$)/.test(lowerUrl);
        if (isAudio) {
          return `
            <div style="margin-top:8px;padding:8px 10px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;">
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:#334155;margin-bottom:4px;">
                <span>🎙️ ${sTitle}</span>
                <a href="${sUrl}" target="_blank" rel="noopener" style="font-size:11.5px;color:#B91C1C;text-decoration:underline;">Mở ↗</a>
              </div>
              <audio controls preload="metadata" src="${sUrl}" style="width:100%;height:36px;"></audio>
            </div>
          `;
        }
        if (isImage) {
          return `
            <div style="margin-top:8px;padding:8px 10px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;">
              <div style="font-size:12px;font-weight:700;color:#334155;margin-bottom:6px;">📷 ${sTitle}</div>
              <a href="${sUrl}" target="_blank" rel="noopener">
                <img src="${sUrl}" alt="${sTitle}" style="max-width:100%;max-height:220px;border-radius:8px;border:1px solid #CBD5E1;display:block;" />
              </a>
            </div>
          `;
        }
        return `<div style="margin-top:6px;"><a href="${sUrl}" target="_blank" rel="noopener" style="font-size:13px;font-weight:700;color:#B91C1C;text-decoration:underline;">📎 ${sTitle} ↗</a></div>`;
      }).join('');
    }

    async function loadTeacherHomeworks() {
      const box = document.getElementById('teacher-grade-list');
      const res = await KtnWebApp.apiRequest('/api/ktn/homeworks');
      const list = (res.ok && Array.isArray(res.data?.homeworks)) ? res.data.homeworks : [];

      if (!list.length) {
        box.innerHTML = '<div style="padding:16px;color:#64748B;">Chưa có bài nộp mới.</div>';
        return;
      }
      const pendingCount = list.filter(h => !h.status || h.status === 'pending').length;
      const revisionCount = list.filter(h => h.status === 'revision_requested' || h.status === 'needs_revision').length;
      const gradedCount = list.filter(h => h.status === 'graded').length;
      const summaryHtml = `
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">

    async function submitTeacherDecision(hwId, safeId, targetStatus) {
      const normalizedStatus = (targetStatus === 'revision_requested' || targetStatus === 'needs_revision')
        ? 'revision_requested'
        : 'graded';
      const scoreEl = document.getElementById('score-' + safeId);
      const fbEl = document.getElementById('fb-' + safeId);
      const passBtn = document.getElementById('btn-grade-pass-' + safeId);
      const revBtn = document.getElementById('btn-grade-rev-' + safeId);
      const statusBox = document.getElementById('grade-status-' + safeId);
      const score = scoreEl ? Number(scoreEl.value) : 9.5;
      const teacherFeedback = fbEl ? fbEl.value.trim() : '';
      if (!teacherFeedback) {
        if (statusBox) {
          statusBox.style.display = 'block';
          statusBox.style.background = '#FEF2F2';
          statusBox.style.color = '#991B1B';
          statusBox.textContent = normalizedStatus === 'revision_requested'
            ? 'Cô hãy ghi rõ điểm cần sửa để học sinh biết cách làm lại bài nhé.'
            : 'Cô hãy nhập lời nhận xét cho học sinh nhé.';
        } else {
          alert(normalizedStatus === 'revision_requested'
            ? 'Cô hãy ghi rõ điểm cần sửa để học sinh biết cách làm lại bài nhé.'
            : 'Cô hãy nhập lời nhận xét cho học sinh nhé.');
        }
        if (fbEl) fbEl.focus();
        return;
      }

      if (passBtn) passBtn.disabled = true;
      if (revBtn) revBtn.disabled = true;
      if (statusBox) {
        statusBox.style.display = 'block';
        statusBox.style.background = '#EFF6FF';
        statusBox.style.color = '#1D4ED8';
        statusBox.textContent = 'Đang lưu kết quả chấm bài...';
      }

      const payload = {
        id: hwId,
        status: normalizedStatus,
        score: normalizedStatus === 'revision_requested' ? null : score,
        teacherFeedback
      };

      const res = await KtnWebApp.apiRequest('/api/ktn/homeworks/grade', {
        method: 'PATCH',
        body: payload
      });

      if (!res.ok || !res.data?.ok) {
        if (passBtn) passBtn.disabled = false;
        if (revBtn) revBtn.disabled = false;
        const errMsg = (res.data && res.data.message) || 'Chưa lưu được kết quả chấm bài lên máy chủ. Cô vui lòng kiểm tra kết nối và thử lại nhé.';
        if (statusBox) {
          statusBox.style.display = 'block';
          statusBox.style.background = '#FEF2F2';
          statusBox.style.color = '#991B1B';
          statusBox.textContent = errMsg;
        } else {
          alert(errMsg);
        }
        return;
      }

      if (statusBox) {
        statusBox.style.display = 'block';
        statusBox.style.background = '#DCFCE7';
        statusBox.style.color = '#15803D';
        statusBox.textContent = normalizedStatus === 'revision_requested'
          ? '✓ Đã gửi yêu cầu "Cần sửa" kèm lời hướng dẫn cho học sinh!'
          : '✓ Đã chấm Hoàn thành và gửi lời nhận xét cho học sinh!';
      }
      await loadTeacherHomeworks();
    }

    function getStoredClassSessions(classCode) {
      try {
        const raw = localStorage.getItem('ktn_class_sessions_' + classCode);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length) return parsed;
        }
      } catch (e) {}
      return Object.prototype.hasOwnProperty.call(DEFAULT_CLASS_SESSIONS, classCode)
        ? DEFAULT_CLASS_SESSIONS[classCode]
        : [];
    }

    async function saveTeacherClassSession(e) {
      e.preventDefault();
      const classCode = document.getElementById('assign-class-code').value;
      const sessionNum = Number(document.getElementById('assign-lesson-num').value) || 1;
      const title = document.getElementById('assign-session-title').value.trim();
      const inputs = Array.from(document.querySelectorAll('.assign-exercise-input'));
      const exercises = inputs.map((inp, i) => {
        const val = inp.value.trim();
        return {
          id: `${classCode}-B${sessionNum}-E${i + 1}`,
          num: i + 1,
          title: val.startsWith('Bài ') ? val : `Bài ${i + 1}: ${val}`,
          type: /chụp|ảnh|viết/i.test(val) ? 'photo' : 'audio'
        };
      }).filter(ex => ex.title);

      const sessionObj = { classCode, sessionNum, title, exercises, updatedAt: new Date().toISOString() };
      const statusEl = document.getElementById('assign-save-status');
      if (statusEl) {
        statusEl.style.color = '#475569';
        statusEl.textContent = 'Đang lưu buổi học lên máy chủ...';
      }

      const res = await KtnWebApp.apiRequest('/api/ktn/class-sessions', {
        method: 'POST',
        body: sessionObj
      });

      if (!res.ok || !res.data?.ok) {
        if (statusEl) {
          statusEl.style.color = '#B91C1C';
          statusEl.textContent = (res.data && res.data.message) || 'Chưa lưu được buổi học lên máy chủ. Cô vui lòng thử lại nhé.';
        }
        return;
      }

      const sessions = getStoredClassSessions(classCode).slice();
      const existingIdx = sessions.findIndex(s => Number(s.sessionNum) === sessionNum);
      if (existingIdx >= 0) sessions[existingIdx] = sessionObj;
      else sessions.push(sessionObj);
      sessions.sort((a, b) => Number(a.sessionNum) - Number(b.sessionNum));

      try {
        localStorage.setItem('ktn_class_sessions_' + classCode, JSON.stringify(sessions));
      } catch (err) {}

      if (statusEl) {
        statusEl.style.color = '#15803D';
        statusEl.textContent = `✓ Đã lưu ${title} (${exercises.length} bài tập) cho lớp ${classCode}!`;
        setTimeout(() => { statusEl.textContent = ''; }, 4000);
      }
    }

    function deduplicateTeacherMessages(list) {
      if (!Array.isArray(list)) return [];
      const seenIds = new Set();
      const seenFingerprints = new Map();
      const out = [];
      for (const m of list) {
        if (!m || typeof m !== 'object') continue;
        const id = String(m.id || '').trim();
        if (id) {
          if (seenIds.has(id)) continue;
          seenIds.add(id);
        }
        const role = String(m.sender_role || '').trim();
        const sender = String(m.sender_email || m.sender_name || '').trim().toLowerCase();
        const text = String(m.content || '').trim();
        const tsMs = Date.parse(m.created_at || '') || 0;
        const fpKey = `${role}|${sender}|${text}`;
        if (text && seenFingerprints.has(fpKey)) {
          const prevTs = seenFingerprints.get(fpKey);
          if (!id || (tsMs && prevTs && Math.abs(tsMs - prevTs) < 4000)) {
            continue;
          }
        }
        if (text) seenFingerprints.set(fpKey, tsMs || Date.now());
        out.push(m);
      }
      return out;
    }

    async function syncTeacherChatRoomsList() {
      try {
        const res = await KtnWebApp.apiRequest('/api/ktn/messages/rooms');
        if (res.ok && res.data?.ok) {
          if (Array.isArray(res.data.groupRooms) && res.data.groupRooms.length > 0) {
            teacherGroupRooms = res.data.groupRooms.map(r => ({
              roomId: r.roomId,
              label: r.label || r.roomId,
              kind: r.kind || (String(r.roomId || '').startsWith('course:') ? 'course' : 'class'),
              latestPreview: r.latestPreview || '',
              messageCount: Number(r.messageCount || 0)
            }));
          }
          if (Array.isArray(res.data.privateThreads) && res.data.privateThreads.length > 0) {
            const merged = [...res.data.privateThreads];
            teacherPrivateThreads.forEach(def => {
              if (!merged.some(t => t.roomId === def.roomId)) merged.push(def);
            });
            teacherPrivateThreads = merged;
          }
        }
      } catch (e) {}
      renderTeacherRoomControls();
    }

      const res = await KtnWebApp.apiRequest('/api/ktn/messages?roomId=' + encodeURIComponent(roomId));
      if (reqSeq !== teacherChatReqSeq || selectEl.value !== roomId) return;

          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
            <strong style="font-size:12px;color:#B91C1C;">${esc(m.sender_name)}:</strong>
            ${!isPrivate ? `<button type="button" class="btn-pin-msg" data-pin-content="${esc(m.content)}" onclick="pinTeacherAnnouncementFromMsg(this)" style="background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;border-radius:6px;padding:2px 6px;font-size:10.5px;font-weight:700;cursor:pointer;">📌 Ghim</button>` : ''}
          </div>
          <div class="teacher-chat-msg-text" style="font-size:13.5px;margin-top:2px;">${esc(m.content)}</div>
        </div>
      `).join('') || '<div style="color:#94A3B8;font-size:13px;">Chưa có tin nhắn trong phòng này.</div>';
      box.scrollTop = box.scrollHeight;
      syncTeacherChatRoomsList();
    }

    let isSendingTeacherChat = false;
    async function sendTeacherChat(e) {
      e.preventDefault();
      if (isSendingTeacherChat) return;
      const roomId = document.getElementById('teacher-room-select').value;
      const input = document.getElementById('teacher-chat-input');
      const content = input ? input.value.trim() : '';
      if (!content) return;
      const submitBtn = e.target?.querySelector?.('button[type="submit"]');
      isSendingTeacherChat = true;
      if (submitBtn) submitBtn.disabled = true;
      try {
        const res = await KtnWebApp.apiRequest('/api/ktn/messages', {
          method: 'POST',
          body: { roomId, classCode: roomId.replace('class:', ''), content }
        });
        const savedMsg = res.ok && res.data?.ok && res.data?.message && res.data.message.id ? res.data.message : null;
        if (!savedMsg) {
          alert(res.data?.message || 'Không gửi được tin nhắn (chưa lưu được vào hệ thống).');
          return;
        }
        input.value = '';
        await loadTeacherChat();
      } finally {
        isSendingTeacherChat = false;
        if (submitBtn) submitBtn.disabled = false;
      }
    }

    async function enableTeacherPwa() {
      const res = await KtnWebApp.registerPwaNotifications({ onSubmitted: true, onAssignedOrChat: true });
      alert(res.ok ? 'Đã bật thông báo nộp bài & tin nhắn mới cho Giáo viên!' : (res.reason || 'Chưa bật được thông báo.'));
    }

    document.addEventListener('DOMContentLoaded', async () => {
      currentTeacherSession = await KtnWebApp.enforceRolePage('teacher');
      if (!currentTeacherSession) return;
      document.getElementById('teacher-welcome-label').textContent =
        `Giáo viên: ${currentTeacherSession.name || currentTeacherSession.email} (${currentTeacherSession.email})`;
      loadTeacherHomeworks();
      loadTeacherClassSessionEditor();
      setInterval(() => {
        const groupsPane = document.getElementById('t-pane-groups');
        if (groupsPane && groupsPane.classList.contains('active') && !isSendingTeacherChat) {
          loadTeacherChat();
        }
      }, 4000);
    });
  </script>
</body>
</html>
