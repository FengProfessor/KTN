name = "ktn-sw-proxy"
main = "cloudflare-worker-sw-proxy.js"
compatibility_date = "2024-11-01"

# Hẹn giờ tự động:
# - Mỗi 5 phút (*/5 * * * *): kiểm tra lịch học chính thức và gửi nhắc giờ học tự động (trước 30 phút / 10 phút)
# - Mỗi ngày 1 lần (0 3 * * * / 10:00 sáng giờ VN): đồng bộ dữ liệu & giữ kết nối Supabase
[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]

[vars]
IZTEACH_VENDOR_ID = "3529cd2b-7af6-4fda-887c-392a79393d6a"
DEFAULT_COURSE_ID = "6adadba969897b0002482ca5"
