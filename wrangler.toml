name = "ktn-sw-proxy"
main = "consultation-worker-entry.mjs"
compatibility_date = "2024-11-01"

# Hẹn giờ tự động:
# - Mỗi 5 phút (*/5 * * * *): kiểm tra lịch học chính thức và gửi nhắc giờ học tự động (trước 30 phút / 10 phút)
# - Mỗi ngày 1 lần (0 3 * * * / 10:00 sáng giờ VN): đồng bộ dữ liệu & giữ kết nối Supabase
[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]

[vars]
IZTEACH_VENDOR_ID = "3529cd2b-7af6-4fda-887c-392a79393d6a"
DEFAULT_COURSE_ID = "6adadba969897b0002482ca5"
KTN_CONSULTATIONS_ENABLED = "true"
KTN_CONSULTATION_MODE = "full"
KTN_CONSULTATION_PUBLIC_URL = "https://khongtunhi.com"
KTN_GEMINI_MODEL = "gemini-3.5-flash-lite"
KTN_GEMINI_FALLBACK_MODELS = "gemini-flash-lite-latest,gemini-3.1-flash-lite-preview"
KTN_SEPAY_SANDBOX = "true"
KTN_ZALO_SANDBOX = "false"

[[ratelimits]]
name = "KTN_CONSULTATION_LIMIT"
namespace_id = "20261114"
simple = { limit = 30, period = 60 }

[[durable_objects.bindings]]
name = "KTN_AI_RELAY"
class_name = "KtnGeminiRelayDO"

[[migrations]]
tag = "v1_ktn_ai_relay_sqlite"
new_sqlite_classes = ["KtnGeminiRelayDO"]
